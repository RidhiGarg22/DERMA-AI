<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <!-- Curved Path for Arched Text -->
    <path id="archPath" d="M 40,175 A 170,120 0 0,1 360,175" fill="none" />
    
    <!-- Metallic Gradient -->
    <linearGradient id="roseSilverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#F1F5F9" />
      <stop offset="70%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Deep 3D Shadow -->
    <filter id="3dShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#B76E79" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Dark Luxury Container Background for standalone usage -->
  <rect width="400" height="240" rx="32" fill="#12131A" />
  
  <!-- Subtle Glow behind text -->
  <ellipse cx="200" cy="110" rx="120" ry="60" fill="#B76E79" opacity="0.12" filter="blur(20px)" />

  <!-- Arched Text "Derma AI" -->
  <text font-family="'Playfair Display', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="58" fill="url(#roseSilverGrad)" filter="url(#3dShadow)" letter-spacing="1">
    <textPath href="#archPath" startOffset="50%" text-anchor="middle">Derma AI</textPath>
  </text>
</svg>
